name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - '.github/dependabot.yml'
      - 'deploy/runner/**'
      - '**.md'
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - '.github/dependabot.yml'
      - 'deploy/runner/**'
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  WASM_BINDGEN_VERSION: "0.2.125"
  TRUNK_VERSION: "0.21.14"

jobs:
  # ── Path filtering ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.final.outputs.backend }}
      frontend: ${{ steps.final.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.actor != 'dependabot[bot]'
        id: filter
        with:
          filters: |
            backend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/api/**'
              - 'crates/db/**'
              - 'crates/shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/frontend/**'
              - 'tailwind.config.js'
              - 'package.json'
              - 'trunk.toml'
              - '.github/workflows/ci.yml'

      - name: Resolve final path flags
        id: final
        run: |
          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          # Force all for Dependabot (filter skipped) or when filter outputs are empty
          if [ "${{ github.actor }}" = "dependabot[bot]" ] || [ -z "$BACKEND" ]; then
            BACKEND=true
            FRONTEND=true
          fi
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT

  # ── Backend: fmt · clippy · test ──────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: >
          cargo clippy
          --workspace
          --exclude gem-finder-frontend
          -- --deny warnings

      - name: test
        run: >
          cargo test
          --workspace
          --exclude gem-finder-frontend
          -- --test-threads=1

  # ── Frontend: wasm32 check · CSS · trunk build ────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-frontend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-frontend-

      - name: cargo check (wasm32)
        run: >
          cargo check
          --package gem-finder-frontend
          --target wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CSS (Tailwind)
        working-directory: crates/frontend
        run: npm install && npm run build:css

      - name: Install trunk (pre-built binary — pinned)
        run: |
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzC /usr/local/bin

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          curl -fsSL \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzC /usr/local/bin --strip-components=1
          chmod +x /usr/local/bin/wasm-bindgen

      - name: trunk build
        working-directory: crates/frontend
        run: trunk build --release
