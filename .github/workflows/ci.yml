name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  # Pinned to match Cargo.lock — bump both together when upgrading wasm-bindgen
  WASM_BINDGEN_VERSION: "0.2.125"
  TRUNK_VERSION: "0.21.14"

jobs:
  # ── Backend: fmt + clippy + tests ────────────────────────────────────────────
  backend:
    name: Backend (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: >
          cargo clippy
          --workspace
          --exclude gem-finder-frontend
          -- --deny warnings

      - name: test
        run: >
          cargo test
          --workspace
          --exclude gem-finder-frontend
          -- --test-threads=1

  # ── Frontend: wasm32 check + CSS build + trunk build ─────────────────────────
  frontend:
    name: Frontend (wasm32 · CSS · trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-frontend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-frontend-

      - name: cargo check (wasm32)
        run: >
          cargo check
          --package gem-finder-frontend
          --target wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CSS (Tailwind)
        # Must run before trunk — index.html references assets/tailwind.css (built output).
        # input.css contains @tailwind directives trunk cannot process.
        working-directory: crates/frontend
        run: npm install && npm run build:css

      - name: Install trunk (pre-built binary — pinned)
        run: |
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzC /usr/local/bin

      - name: Install wasm-bindgen-cli (pre-built binary — pinned to Cargo.lock)
        # Pinned to match wasm-bindgen crate version. Mismatches cause trunk to fail.
        # Bump WASM_BINDGEN_VERSION env var when upgrading the crate.
        run: |
          curl -fsSL \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzC /usr/local/bin --strip-components=1
          chmod +x /usr/local/bin/wasm-bindgen

      - name: trunk build
        working-directory: crates/frontend
        run: trunk build --release
