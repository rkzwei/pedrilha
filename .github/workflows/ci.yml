name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  # Pinned to match Cargo.lock — bump both together when upgrading wasm-bindgen
  WASM_BINDGEN_VERSION: "0.2.125"
  TRUNK_VERSION: "0.21.14"

jobs:
  # ── Path filtering ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/api/**'
              - 'crates/db/**'
              - 'crates/shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/frontend/**'
              - 'tailwind.config.js'
              - 'package.json'
              - 'trunk.toml'
              - '.github/workflows/ci.yml'

      - name: Check last run status
        id: last_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              per_page: 2
            });
            const lastRun = runs.data.workflow_runs[1];
            return lastRun?.conclusion === 'failure' ? 'true' : 'false';
          result-encoding: string

      - name: Force all jobs if last run failed
        if: steps.last_run.outputs.result == 'true'
        run: |
          echo "backend=true" >> $GITHUB_OUTPUT
          echo "frontend=true" >> $GITHUB_OUTPUT

  # ── Backend: fmt · clippy · test · release build ─────────────────────────────
  # All steps share one runner and one cache — no duplicate compile.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: >
          cargo clippy
          --workspace
          --exclude gem-finder-frontend
          -- --deny warnings

      - name: test
        run: >
          cargo test
          --workspace
          --exclude gem-finder-frontend
          -- --test-threads=1

      - name: Build release binary
        run: cargo build --release --package gem-finder-api

      - name: Upload binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gem-finder-api
          path: target/release/gem-finder-api
          retention-days: 1

  # ── Frontend: wasm32 check · CSS · trunk release build ───────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (wasm)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-frontend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-frontend-

      - name: cargo check (wasm32)
        run: >
          cargo check
          --package gem-finder-frontend
          --target wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CSS (Tailwind)
        working-directory: crates/frontend
        run: npm install && npm run build:css

      - name: Install trunk (pre-built binary — pinned)
        run: |
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzC /usr/local/bin

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          curl -fsSL \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzC /usr/local/bin --strip-components=1
          chmod +x /usr/local/bin/wasm-bindgen

      - name: trunk build
        working-directory: crates/frontend
        run: trunk build --release

      - name: Upload dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/frontend/dist/
          retention-days: 1

  # ── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - name: Download binary
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gem-finder-api
          path: artifacts/

      - name: Download frontend dist
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure rsync is available (runner)
        run: command -v rsync || sudo apt-get install -y rsync

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '✓ SSH connection successful — host: $(hostname), user: $(whoami)'"

      - name: Prepare VPS directories
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/gem-finder/dist"

      - name: Upload binary to VPS
        if: needs.changes.outputs.backend == 'true'
        run: |
          chmod +x artifacts/gem-finder-api
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/gem-finder-api \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/gem-finder-api.new

      - name: Upload frontend dist to VPS
        if: needs.changes.outputs.frontend == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/dist/

      - name: Swap binary and restart service
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo mv /opt/gem-finder/gem-finder-api.new /opt/gem-finder/gem-finder-api && \
             sudo systemctl restart gem-finder && \
             systemctl is-active gem-finder"
