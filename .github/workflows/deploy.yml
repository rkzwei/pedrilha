name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/runner/**'
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  WASM_BINDGEN_VERSION: "0.2.125"
  TRUNK_VERSION: "0.21.14"
  CARGO_TARGET_DIR: /home/runner/.cargo-target

jobs:
  # ── Path filtering ─────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: self-hosted
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      actions: read
      contents: read
    outputs:
      backend: ${{ steps.final.outputs.backend }}
      frontend: ${{ steps.final.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/api/**'
              - 'crates/db/**'
              - 'crates/shared/**'
            frontend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/frontend/**'
              - 'tailwind.config.js'
              - 'package.json'
              - 'trunk.toml'

      - name: Check last deploy status
        id: last_run
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                branch: 'main',
                per_page: 2
              });
              const lastRun = runs.data.workflow_runs[1];
              if (!lastRun || lastRun.conclusion !== 'failure') {
                return JSON.stringify({ backend: false, frontend: false });
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: lastRun.id,
              });
              const failed = name => jobs.data.jobs.some(j => j.name === name && j.conclusion === 'failure');
              const deployFailed = failed('Deploy to VPS');
              return JSON.stringify({
                backend: failed('Backend') || deployFailed,
                frontend: failed('Frontend') || deployFailed,
              });
            } catch (e) {
              core.warning(`Could not check last run: ${e.message}`);
              return JSON.stringify({ backend: true, frontend: true });
            }
          result-encoding: string

      - name: Resolve final path flags
        id: final
        run: |
          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          LAST='${{ steps.last_run.outputs.result }}'
          if [ "$(echo "$LAST" | jq -r '.backend')" = "true" ]; then BACKEND=true; fi
          if [ "$(echo "$LAST" | jq -r '.frontend')" = "true" ]; then FRONTEND=true; fi
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT

  # ── Backend: fmt · clippy · test · release build ──────────────────────────────
  backend:
    name: Backend
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: fmt
        run: >
          cargo fmt --check
          -p gem-finder-api
          -p gem-finder-db
          -p gem-finder-shared

      - name: clippy
        run: >
          cargo clippy
          --workspace
          --exclude gem-finder-frontend
          -- --deny warnings

      - name: test
        run: >
          cargo test
          --workspace
          --exclude gem-finder-frontend
          -- --test-threads=1

      - name: Build release binary
        run: cargo build --release --package gem-finder-api

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: gem-finder-api
          path: ${{ env.CARGO_TARGET_DIR }}/release/gem-finder-api
          retention-days: 1

      - name: Prune cargo registry cache
        if: always()
        run: |
          CACHE="${CARGO_HOME}/registry/cache"
          find "${CACHE}" -name "*.crate" -mtime +7 -delete 2>/dev/null || true
          LIMIT=$((10 * 1024 * 1024 * 1024))
          while true; do
            SIZE=$(du -sb "${CACHE}" 2>/dev/null | cut -f1 || echo 0)
            [ "${SIZE}" -le "${LIMIT}" ] && break
            OLDEST=$(find "${CACHE}" -name "*.crate" -printf '%T@ %p\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)
            [ -z "${OLDEST}" ] && break
            rm -f "${OLDEST}"
          done

  # ── Frontend: wasm32 check · CSS · trunk release build ────────────────────────
  frontend:
    name: Frontend
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (wasm)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-frontend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-frontend-

      - name: fmt
        run: cargo fmt --check -p gem-finder-frontend

      - name: cargo check (wasm32)
        run: >
          cargo check
          --package gem-finder-frontend
          --target wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build CSS (Tailwind)
        working-directory: crates/frontend
        run: npm install && npm run build:css

      - name: Install trunk (pre-built binary — pinned)
        run: |
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzC "${CARGO_HOME}/bin"

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          curl -fsSL \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzC "${CARGO_HOME}/bin" --strip-components=1
          chmod +x "${CARGO_HOME}/bin/wasm-bindgen"

      - name: trunk build
        working-directory: crates/frontend
        run: trunk build --release

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: crates/frontend/dist/
          retention-days: 1

      - name: Prune cargo registry cache
        if: always()
        run: |
          CACHE="${CARGO_HOME}/registry/cache"
          find "${CACHE}" -name "*.crate" -mtime +7 -delete 2>/dev/null || true
          LIMIT=$((10 * 1024 * 1024 * 1024))
          while true; do
            SIZE=$(du -sb "${CACHE}" 2>/dev/null | cut -f1 || echo 0)
            [ "${SIZE}" -le "${LIMIT}" ] && break
            OLDEST=$(find "${CACHE}" -name "*.crate" -printf '%T@ %p\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)
            [ -z "${OLDEST}" ] && break
            rm -f "${OLDEST}"
          done

  # ── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    needs: [changes, backend, frontend]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - name: Download binary
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: gem-finder-api
          path: artifacts/

      - name: Download frontend dist
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: artifacts/dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure rsync is available (runner)
        run: command -v rsync || sudo apt-get install -y rsync

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo SSH OK — host: $(hostname), user: $(whoami)"

      - name: Prepare VPS directories
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/gem-finder/dist"

      - name: Upload binary to VPS
        if: needs.changes.outputs.backend == 'true'
        run: |
          chmod +x artifacts/gem-finder-api
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/gem-finder-api \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/gem-finder-api.new

      - name: Upload frontend dist to VPS
        if: needs.changes.outputs.frontend == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/dist/

      - name: Swap binary and restart service
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo mv /opt/gem-finder/gem-finder-api.new /opt/gem-finder/gem-finder-api && \
             sudo systemctl restart gem-finder && \
             systemctl is-active gem-finder"
