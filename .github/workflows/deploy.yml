name: Deploy

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.125"
  TRUNK_VERSION: "0.21.14"

jobs:
  # ── Build backend release binary ─────────────────────────────────────────────
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-backend-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-backend-release-

      - name: Build
        run: cargo build --release --package gem-finder-api

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gem-finder-api
          path: target/release/gem-finder-api
          retention-days: 1

  # ── Build frontend WASM + CSS ─────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-frontend-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-frontend-release-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CSS (Tailwind)
        working-directory: crates/frontend
        run: npm install && npm run build:css

      - name: Install trunk (pre-built binary)
        run: |
          curl -fsSL \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzC /usr/local/bin

      - name: Install wasm-bindgen-cli (pinned)
        run: |
          curl -fsSL \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzC /usr/local/bin --strip-components=1
          chmod +x /usr/local/bin/wasm-bindgen

      - name: trunk build
        working-directory: crates/frontend
        run: trunk build --release

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/frontend/dist/
          retention-days: 1

  # ── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Only deploy on direct pushes to main — not from forks or PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: gem-finder-api
          path: artifacts/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ConnectTimeout=10 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '✓ SSH connection successful — host: $(hostname), user: $(whoami)'"

      - name: Upload binary to VPS
        run: |
          chmod +x artifacts/gem-finder-api
          rsync -avz --progress \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/gem-finder-api \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/gem-finder-api.new

      - name: Upload frontend dist to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            artifacts/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gem-finder/dist/

      - name: Swap binary and restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo mv /opt/gem-finder/gem-finder-api.new /opt/gem-finder/gem-finder-api && \
             sudo systemctl restart gem-finder && \
             systemctl is-active gem-finder"
