version: 2
updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      patch-minor:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3

  # JS frontend (Tailwind, js-sys, etc.)
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      patch-minor:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
