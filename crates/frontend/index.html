<!DOCTYPE html>
<html lang="en">
<head>
    <link data-trunk rel="copy-file" href="assets/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gem Finder</title>
    <!-- Google Fonts: Bebas Neue (display headings) + Barlow (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link data-trunk rel="css" href="assets/tailwind.css" />
    <!-- Umami analytics — deferred, non-blocking -->
    <script defer src="https://stats.rkzwei.dev/script.js" data-website-id="187f4aa5-e419-40f5-80c8-688a7aaa3c62"></script>
    <!-- Ko-fi tip button — lazy-loaded after app starts to avoid blocking first paint -->
    <script>
        addEventListener("TrunkApplicationStarted", function() {
            var s = document.createElement("script");
            s.src = "https://storage.ko-fi.com/cdn/widget/Widget_2.js";
            s.onload = function() { kofiwidget2.init('spare some change?', '#452512', 'A8F6229LBN'); kofiwidget2.draw(); };
            document.body.appendChild(s);
        }, { once: true });
    </script>
    <style>
        .btn-container { position: fixed !important; top: auto !important; bottom: 16px !important; left: auto !important; right: 16px !important; }
        @keyframes gf-pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    </style>
</head>
<body style="background-color:#0d0906;color:#e7e5e4;margin:0">
    <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0906;z-index:9999">
        <div style="font-family:'Bebas Neue',sans-serif;letter-spacing:0.15em;font-size:3rem;color:#e7e5e4;animation:gf-pulse 2s ease-in-out infinite">GEM FINDER</div>
        <div style="color:#78716c;font-size:0.875rem;margin-top:1rem;font-family:Barlow,sans-serif">Digging for gems…</div>
    </div>
    <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0906;color:#e7e5e4;font-family:'Bebas Neue',sans-serif;letter-spacing:0.1em;font-size:1.5rem">Gem Finder needs JavaScript/WebAssembly.</div></noscript>
</body>
</html>
