[package]
name = "gem-finder-frontend"
version.workspace = true
edition.workspace = true

[dependencies]
gem-finder-shared = { path = "../shared" }
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", features = ["json"] }
web-sys = { version = "0.3", features = ["Window", "Navigator", "History", "Storage", "Location", "Document", "Element", "MouseEvent", "KeyboardEvent", "HtmlInputElement", "HtmlElement", "Node", "EventTarget", "FocusEvent"] }
console_error_panic_hook = "0.1"
