services:
  runner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Persistent target dir — points to a named volume, not the checkout dir
      CARGO_TARGET_DIR: /home/runner/.cargo-target
    volumes:
      # registry/cache and registry/index are safe to share (immutable after download)
      # registry/src is NOT shared — concurrent extraction causes "File exists" errors
      - cargo-registry-cache:/home/runner/.cargo/registry/cache
      - cargo-registry-index:/home/runner/.cargo/registry/index
      - cargo-git:/home/runner/.cargo/git
      # Per-container: src extraction, compiled artifacts, and work dir
      - /home/runner/.cargo/registry/src
      - /home/runner/.cargo-target
      - /home/runner/work

volumes:
  cargo-registry-cache:
  cargo-registry-index:
  cargo-git:
