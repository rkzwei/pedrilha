services:
  runner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Persistent target dir — points to a named volume, not the checkout dir
      CARGO_TARGET_DIR: /home/runner/.cargo-target
    volumes:
      # Shared cargo source cache — safe to share across runners (read-heavy)
      - cargo-registry:/home/runner/.cargo/registry
      - cargo-git:/home/runner/.cargo/git
      # Per-container: compiled artifacts and work dir must not be shared
      # (concurrent builds would corrupt each other's incremental state)
      - /home/runner/.cargo-target
      - /home/runner/work

volumes:
  cargo-registry:
  cargo-git:
