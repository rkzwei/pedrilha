services:
  runner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Persistent target dir — points to a named volume, not the checkout dir
      CARGO_TARGET_DIR: /home/runner/.cargo-target
    volumes:
      # Cargo cache — persists between runs (no re-downloading crates)
      - cargo-registry:/home/runner/.cargo/registry
      - cargo-git:/home/runner/.cargo/git
      # Compiled artifacts — enables incremental builds (biggest speedup)
      - cargo-target:/home/runner/.cargo-target
      # Runner work dir — keeps checkouts between runs
      - runner-work:/home/runner/work

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  runner-work:
